<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — RiskAtlas</title>
  <meta name="description" content="RiskAtlas privacy policy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --brand:#7239ea; --brand-700:#5b27c4;
      --bg:#ffffff; --bg-soft:#fafafa;
      --ink:#0a0a0a; --ink-2:#3f3f46; --muted:#71717a;
      --border:#e4e4e7; --radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6}
    .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:-.02em;font-size:18px}
    .dot{width:22px;height:22px;border-radius:7px;background:var(--brand);display:inline-block}
    .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;transition:.15s}
    .back:hover{border-color:var(--brand);color:var(--brand)}
    .wrap{max-width:760px;margin:0 auto;padding:56px 24px 40px}
    .kicker{font-size:13px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
    .sub{color:var(--muted);font-size:15px;margin-bottom:36px}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px 36px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    /* تنسيق محتوى Termly المضمّن */
    [name="termly-embed"]{font-size:15px;color:var(--ink-2)}
    [name="termly-embed"] h1,[name="termly-embed"] h2,[name="termly-embed"] h3{color:var(--ink);margin:24px 0 10px;letter-spacing:-.01em}
    [name="termly-embed"] a{color:var(--brand);text-decoration:none}
    [name="termly-embed"] a:hover{text-decoration:underline}
    .foot{max-width:760px;margin:0 auto;padding:32px 24px 56px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:center}
    .foot a{color:var(--muted);text-decoration:none;font-size:13px}
    .foot a:hover{color:var(--brand)}
    .foot .copy{width:100%;text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
    @media(max-width:600px){.card{padding:24px 18px}h1{font-size:28px}.wrap{padding:36px 16px 24px}}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><span class="dot"></span>RiskAtlas</a>
    <a class="back" href="/">&larr; Back to app</a>
  </nav>

  <main class="wrap">
    <div class="kicker">Legal</div>
    <h1>Privacy Policy</h1>
    <p class="sub">How RiskAtlas, LLC collects, uses, and protects your data.</p>
    <div class="card">
      <!-- Termly Privacy Policy embed -->
      <div name="termly-embed" data-id="PRIVACY_POLICY_UUID"></div>
      <script type="text/javascript">
        (function(d, s, id) {
          var js, tjs = d.getElementsByTagName(s)[0];
          if (d.getElementById(id)) return;
          js = d.createElement(s); js.id = id;
          js.src = "https://app.termly.io/embed-policy.min.js";
          tjs.parentNode.insertBefore(js, tjs);
        }(document, "script", "termly-jssnippet"));
      </script>
    </div>
  </main>

  <footer class="foot">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/cookies">Cookies</a>
    <a href="/contact">Contact</a>
    <div class="copy">&copy; <span id="yr"></span> RiskAtlas, LLC. All rights reserved.</div>
  </footer>
  <script>document.getElementById("yr").textContent=new Date().getFullYear();</script>
</body>
</html>

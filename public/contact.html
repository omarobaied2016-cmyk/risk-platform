<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — RiskAtlas</title>
  <meta name="description" content="Get in touch with the RiskAtlas team." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --brand:#7239ea; --brand-700:#5b27c4;
      --bg:#ffffff; --bg-soft:#fafafa;
      --ink:#0a0a0a; --ink-2:#3f3f46; --muted:#71717a;
      --border:#e4e4e7; --radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-soft);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6}
    .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:-.02em;font-size:18px}
    .dot{width:22px;height:22px;border-radius:7px;background:var(--brand);display:inline-block}
    .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;transition:.15s}
    .back:hover{border-color:var(--brand);color:var(--brand)}
    .wrap{max-width:560px;margin:0 auto;padding:56px 24px 40px}
    .kicker{font-size:13px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
    .sub{color:var(--muted);font-size:15px;margin-bottom:32px}
    .sub a{color:var(--brand);text-decoration:none}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:30px 32px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
    .field{margin-bottom:18px}
    input,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;transition:.15s;outline:none}
    input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(114,57,234,.12)}
    textarea{resize:vertical;min-height:120px}
    .btn{width:100%;font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--brand);border:none;border-radius:10px;padding:13px;cursor:pointer;transition:.15s}
    .btn:hover{background:var(--brand-700)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:14px;font-size:14px;padding:11px 14px;border-radius:10px;display:none}
    .msg.ok{display:block;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
    .msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .foot{max-width:560px;margin:0 auto;padding:32px 24px 56px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:center}
    .foot a{color:var(--muted);text-decoration:none;font-size:13px}
    .foot a:hover{color:var(--brand)}
    .foot .copy{width:100%;text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
    @media(max-width:600px){.card{padding:24px 18px}h1{font-size:28px}.wrap{padding:36px 16px 24px}}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><span class="dot"></span>RiskAtlas</a>
    <a class="back" href="/">&larr; Back to app</a>
  </nav>

  <main class="wrap">
    <div class="kicker">Contact</div>
    <h1>Get in touch</h1>
    <p class="sub">Questions about RiskAtlas, billing, or your account? Send us a message and we will get back to you. You can also email <a href="mailto:support@riskatlas.pro">support@riskatlas.pro</a>.</p>

    <div class="card">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name" />
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@company.com" />
      </div>
      <div class="field">
        <label for="company">Company <span style="color:var(--muted);font-weight:400">(optional)</span></label>
        <input id="company" type="text" autocomplete="organization" placeholder="Company name" />
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="How can we help?"></textarea>
      </div>
      <button class="btn" id="send" onclick="submitContact()">Send message</button>
      <div class="msg" id="result"></div>
    </div>
  </main>

  <footer class="foot">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/cookies">Cookies</a>
    <a href="/contact">Contact</a>
    <div class="copy">&copy; <span id="yr"></span> RiskAtlas, LLC. All rights reserved.</div>
  </footer>

  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();
    function isEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}
    async function submitContact(){
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var company = document.getElementById("company").value.trim();
      var message = document.getElementById("message").value.trim();
      var btn = document.getElementById("send");
      var box = document.getElementById("result");
      box.className = "msg";

      if(!name || !email || !message){ show("err","Please fill in your name, email, and message."); return; }
      if(!isEmail(email)){ show("err","Please enter a valid email address."); return; }

      btn.disabled = true; btn.textContent = "Sending...";
      try{
        var res = await fetch("/api/contact",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({name,email,company,message})
        });
        var data = await res.json().catch(function(){return {};});
        if(res.ok && data.ok){
          show("ok","Thanks — your message has been sent. We'll reply soon.");
          document.getElementById("name").value="";
          document.getElementById("email").value="";
          document.getElementById("company").value="";
          document.getElementById("message").value="";
        } else {
          show("err", data.error || "Something went wrong. Please email support@riskatlas.pro.");
        }
      }catch(e){
        show("err","Network error. Please email support@riskatlas.pro.");
      }finally{
        btn.disabled = false; btn.textContent = "Send message";
      }
      function show(type,text){ box.className = "msg "+type; box.textContent = text; }
    }
  </script>
</body>
</html>
